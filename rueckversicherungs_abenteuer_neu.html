<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Rückversicherungs-Abenteuer</title>
<style>
:root{--lake:#006B7D;--lake-dark:#004C5A;--purple:#6D3FA0;--magenta:#C33C8B;--pink:#E64B73;--lime:#A7C947;--lime-dark:#66851F;--red:#D64A4A;--sun:#F3C64E;--ice:#EAF5F5;--lav:#F3EEF8;--rose:#FCEEF3;--white:#fff;--ink:#17313A;--muted:#60757B;--line:#D6E4E5;--navy:var(--lake-dark);--blue:var(--lake);--cyan:#35AFC0;--light:#F7FAF9;--green:var(--lime-dark);--yellow:var(--sun)}
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Segoe UI",sans-serif;background:linear-gradient(180deg,#F7FAF9 0%,#F3F7F7 100%);color:var(--ink)}
.top{background:linear-gradient(120deg,var(--lake-dark),var(--lake) 62%,#138C96);color:white;padding:22px;border-bottom:6px solid var(--lime)}.wrap{max-width:1150px;margin:auto}.masthead{display:flex;justify-content:space-between;gap:20px;align-items:center}.masthead h1{margin:0;font-size:38px;letter-spacing:-1px}.masthead p{margin:6px 0;color:#DDF2F2}.score{background:white;color:var(--lake-dark);padding:10px 15px;border-radius:999px;font-weight:700;box-shadow:0 3px 12px #00343d33}.main{padding:22px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 8px 25px #004c5a12}.mission{cursor:pointer;min-height:175px;position:relative;border-top:5px solid var(--lake)}.mission:nth-child(2){border-top-color:var(--magenta)}.mission:nth-child(3){border-top-color:var(--pink)}.mission:nth-child(4){border-top-color:var(--purple)}.mission:nth-child(5){border-top-color:var(--lime)}.mission:nth-child(6){border-top-color:var(--sun)}.mission:hover{border-color:var(--lake);transform:translateY(-2px);box-shadow:0 12px 28px #004c5a20}.mission .ico{font-size:48px;position:absolute;right:18px;bottom:12px}.mission small{color:var(--lake);font-weight:800}.mission p,.muted{color:var(--muted);line-height:1.5}
.btn{border:0;border-radius:12px;padding:12px 16px;background:var(--lake);color:white;font-weight:800;cursor:pointer;font-size:15px;box-shadow:0 3px 8px #004c5a20}.btn:hover{filter:brightness(.94)}.btn.alt{background:var(--ice);color:var(--lake-dark);box-shadow:none}.btn.warn{background:var(--sun);color:#3A3000}.btn.red{background:var(--red)}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.two{display:grid;grid-template-columns:1.35fr .8fr;gap:16px}@media(max-width:800px){.two{grid-template-columns:1fr}.masthead{align-items:flex-start;flex-direction:column}}
.feedback{padding:14px;margin-top:12px;background:var(--ice);border-left:5px solid var(--lake);border-radius:10px;line-height:1.5}.good{border-left-color:var(--lime);background:#F3F8E8}.bad{border-left-color:var(--red);background:#FDEEEE}.stat{background:#F5F9F8;border:1px solid var(--line);padding:13px;border-radius:12px;margin:8px 0}.stat strong{display:block;font-size:22px}.big{font-size:34px;font-weight:900}.choice{border:2px solid var(--line);border-radius:12px;padding:12px;margin:8px 0;cursor:pointer;background:white}.choice:hover,.choice.sel{border-color:var(--lake);background:var(--ice)}.screen{display:none}.screen.on{display:block}.between{display:flex;justify-content:space-between;gap:12px;align-items:center}.head h2{font-size:32px;margin:5px 0}.head{margin-bottom:15px}.step{display:inline-block;background:var(--purple);color:white;border-radius:999px;padding:5px 10px;font-weight:800;font-size:12px}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--lake-dark);background:#F4F9F8}input,select{width:100%;padding:10px;border:1px solid #B7CDCF;border-radius:10px;font-size:16px;background:white}.label{display:block;font-weight:800;margin:12px 0 5px}.skill{font-size:19px;font-weight:900;color:var(--lime-dark)}
/* Landschaft: Berg -> Fluss */.valley{height:420px;position:relative;overflow:hidden;border-radius:18px;background:linear-gradient(#CDECF2 0 47%,#DDECC8 47%);border:1px solid #C9DFDF}.mountain{position:absolute;bottom:90px;width:0;height:0;border-left:370px solid transparent;border-right:370px solid transparent;border-bottom:300px solid #8EBF72;left:-210px}.mountain2{position:absolute;bottom:90px;width:0;height:0;border-left:320px solid transparent;border-right:320px solid transparent;border-bottom:230px solid #A7CB82;right:-190px}.river{position:absolute;bottom:0;left:0;width:100%;height:92px;background:linear-gradient(#45B8C6,var(--lake));border-top:8px solid #A9DCE0}.river b{position:absolute;left:46%;top:32px;color:white;font-size:22px}.building{position:absolute;z-index:5;text-align:center;cursor:pointer}.building .pic{font-size:55px;filter:drop-shadow(0 5px 3px #0003)}.building .tag{background:white;border-radius:8px;padding:4px 7px;font-size:12px;font-weight:800;box-shadow:0 2px 8px #0002}.b0{left:8%;bottom:230px}.b1{left:25%;bottom:170px}.b2{left:42%;bottom:105px}.b3{right:36%;bottom:108px}.b4{right:20%;bottom:165px}.b5{right:6%;bottom:235px}.waterline{position:absolute;bottom:92px;left:0;right:0;height:0;background:#35AFC077;z-index:4;transition:.5s}.flood .waterline{height:72px}
.timeline{display:flex;gap:8px;overflow:auto}.year{min-width:135px;background:#F6F9F8;border:1px solid var(--line);padding:12px;border-radius:12px}.bar{height:26px;background:#E8EFEF;border-radius:8px;overflow:hidden;margin:6px 0}.bar div{height:100%;background:var(--lake);color:white;padding:4px 8px;font-weight:800}.mapbox{background:linear-gradient(135deg,var(--ice),#F4F0F8);border-radius:15px;padding:18px;text-align:center;border:1px solid var(--line)}.world{font-size:90px}.arrow{font-size:30px;color:var(--magenta)}.japan{font-size:80px}.tokyo{font-size:70px}.moneypos{color:var(--lime-dark)}.moneyneg{color:var(--red)}.capitalbar{height:38px;background:#E8EFEF;border-radius:12px;overflow:hidden;margin:10px 0}.capitalbar div{height:100%;background:linear-gradient(90deg,var(--lake),#35AFC0);color:white;font-weight:800;padding:9px;min-width:3px;transition:.4s}.calc-table select{min-width:95px}.calc-table td,.calc-table th{vertical-align:middle}.sticky-map{margin-bottom:16px}.note{font-size:14px;color:var(--muted)}

/* Smartphone / Edge: fingerfreundliche Bedienelemente und flexible Darstellung */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{min-width:0;overflow-x:hidden}
button,input,select{font-family:inherit}
button,.choice,.mission,.building{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button{min-height:44px;max-width:100%;white-space:normal}
button:focus-visible,.choice:focus-visible,.mission:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--magenta);outline-offset:3px}
.card,.stat,.feedback,.head,.wrap{min-width:0;overflow-wrap:anywhere}
.calc-table{min-width:680px}
.calc-table th,.calc-table td{white-space:normal}
.calc-table select{min-width:100px}
@media(max-width:600px){
 .top{padding:16px 14px}.main{padding:12px}.masthead{gap:10px}.masthead h1{font-size:clamp(24px,7vw,32px);letter-spacing:-.5px}.masthead p{font-size:14px}
 .head h2{font-size:clamp(23px,6vw,30px)}.big{font-size:28px}
 .card{padding:14px;border-radius:14px}.grid{grid-template-columns:minmax(0,1fr);gap:12px}
 .mission{min-height:125px;padding-right:75px}.mission .ico{font-size:38px}
 .between{flex-wrap:wrap;align-items:flex-start}.row{gap:8px}.row>.btn{flex:1 1 145px}
 .valley{height:330px}.mountain{border-left-width:230px;border-right-width:230px;border-bottom-width:215px;left:-145px;bottom:78px}.mountain2{border-left-width:210px;border-right-width:210px;border-bottom-width:170px;right:-125px;bottom:78px}
 .river{height:78px}.river b{font-size:17px;top:26px}.waterline{bottom:78px}
 .building .pic{font-size:clamp(27px,8vw,42px)}.building .tag{font-size:10px;padding:3px 4px;max-width:80px}
 .b0{left:3%;bottom:185px}.b1{left:20%;bottom:145px}.b2{left:37%;bottom:88px}.b3{right:35%;bottom:88px}.b4{right:18%;bottom:145px}.b5{right:2%;bottom:185px}
 .timeline{scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}.year{scroll-snap-align:start}
 .world{font-size:60px}.japan{font-size:56px}.tokyo{font-size:52px}
 table{font-size:13px}th,td{padding:7px}.capitalbar{height:42px}
}
@media(max-width:380px){.building .pic{font-size:27px}.building .tag{font-size:9px}.valley{height:300px}.b0,.b5{bottom:170px}.b1,.b4{bottom:130px}.b2,.b3{bottom:82px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
</style><meta name="theme-color" content="#006B7D"><meta name="description" content="Sechs spielerische Missionen rund um Versicherung und Rückversicherung – auf Deutsch."></head><body><div class="top"><div class="wrap masthead"><div><h1>🛡️ Rückversicherungs-Abenteuer</h1><p>6 Missionen. Du entscheidest. Der Zufall entscheidet mit.</p></div><div class="score">⭐ Geschafft: <span id="sc">0</span>/6</div></div></div><main class="wrap main"><section id="home" class="screen on"><div class="card"><h2>Willkommen im Risiko-Labor!</h2><p>Du musst noch nichts über Versicherungen wissen. In jeder Mission findest du selbst heraus, wie sie funktionieren.</p></div><br><div id="grid" class="grid"></div></section><section id="q" class="screen"></section></main>
<script>
const S={done:new Set(),floodGuess:{},bank:20,bad:0,year:0,re:false};const M=[['🌊','Das Flut-Dorf','Welche Häuser sind bei Hochwasser besonders gefährdet?'],['🍫','Der Schokoladen-Fall','Ein Fehler in einer Schokolade – und dann?'],['🇯🇵','Das grosse Erdbeben','Wie gross kann ein Schaden in einer riesigen Stadt werden?'],['🏦','Bleibt deine Versicherung offen?','Führe eine Versicherung durch gute und schlechte Jahre.'],['🔎','Risiko-Detektiv','Welche Hinweise sind wichtig – und welche lenken nur ab?'],['🤝','Der grosse Rückversicherungs-Deal','Welchen Preis verlangst du für ein seltenes, riesiges Risiko?']];
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('on'));document.getElementById(id).classList.add('on');scrollTo(0,0)}function home(){document.getElementById('sc').textContent=S.done.size;document.getElementById('grid').innerHTML=M.map((m,i)=>`<div class="card mission" onclick="openQ(${i+1})"><small>MISSION ${i+1}${S.done.has(i+1)?' · ✓ GESCHAFFT':''}</small><h2>${m[1]}</h2><p>${m[2]}</p><div class="ico">${m[0]}</div></div>`).join('');show('home')}function shell(n,title,sub,html){q.innerHTML=`<div class="head between"><div><span class="step">MISSION ${n} VON 6</span><h2>${M[n-1][0]} ${title}</h2><p class="muted">${sub}</p></div><button class="btn alt" onclick="home()">← Missionen</button></div>${html}`;show('q')}function unlock(n,name,text){S.done.add(n);sc.textContent=S.done.size;return `<div class="feedback good"><div class="skill">⭐ Neues Wissen: ${name}</div>${text}</div>`}function openQ(n){[0,q1,q2,q3,q4,q5,q6][n]()}
const H=[['Berghütte','🛖',300000,0.01,.2],['Einfamilienhaus','🏠',900000,.03,.25],['Schuppen','🏚️',120000,.12,.35],['Villa','🏡',2500000,.15,.4],['Wohnhaus','🏠',1200000,.04,.25],['Villa am Berg','🏡',2200000,.01,.2]];
function floodMap(){return `<div class="card sticky-map"><h3>Deine Karte bleibt sichtbar</h3><div class="valley"><div class="mountain"></div><div class="mountain2"></div><div class="river"><b>FLUSS</b></div><div class="waterline"></div>${H.map((h,i)=>`<div class="building b${i}" onclick="house(${i})"><div class="pic">${h[1]}</div><div class="tag">${h[0]}<br>Wert: ${fmt(h[2])}</div></div>`).join('')}</div><div id="finfo" class="feedback">Schau jederzeit zurück: Wie hoch steht das Gebäude? Wie nahe ist es am Fluss?</div></div>`}
function q1(){shell(1,'Das Flut-Dorf','Schau zuerst nur auf die Landschaft. Noch musst du nichts rechnen.',`<div class="two">${floodMap()}<div class="card"><h3>Schritt 1: Wo kommt das Wasser eher hin?</h3><p>Wähle alle Gebäude, die deiner Meinung nach <b>häufiger</b> von Hochwasser getroffen werden.</p>${H.map((h,i)=>`<div class="choice" data-i="${i}" onclick="this.classList.toggle('sel')">${h[1]} ${h[0]}</div>`).join('')}<div class="row"><button class="btn alt" onclick="hint1()">💡 Hilfe</button><button class="btn" onclick="flood2()">Meine Auswahl prüfen →</button></div><div id="hint"></div></div></div>`)}function house(i){finfo.innerHTML=`<b>${H[i][1]} ${H[i][0]}</b><br>Wert: ${fmt(H[i][2])}. Überlege: Wie weit ist es zum Fluss? Und wie hoch steht es?`}function hint1(){hint.innerHTML='<div class="feedback">Stell dir starken Regen vor. Wasser fliesst <b>bergab</b> und der Fluss steigt. Welche Gebäude erreicht das Wasser zuerst?</div>'}function flood2(){let a=[...document.querySelectorAll('.choice.sel')].map(x=>+x.dataset.i);let ok=a.includes(2)&&a.includes(3);shell(1,'Das Flut-Dorf','Gut. Jetzt schätzen wir, wie oft Hochwasser ein Gebäude treffen könnte.',`${floodMap()}<div class="card"><h3>Schritt 2: Schätze selbst</h3><p>Stell dir <b>100 Jahre</b> vor. Wie oft könnte jedes Gebäude Hochwasser abbekommen? Die Karte bleibt oben sichtbar.</p>${H.map((h,i)=>`<label class="label">${h[1]} ${h[0]} – in 100 Jahren ungefähr …</label><select id="g${i}"><option value="1">1-mal</option><option value="3">3-mal</option><option value="5">5-mal</option><option value="10">10-mal</option><option value="15">15-mal</option><option value="25">25-mal</option></select>`).join('')}<button class="btn" onclick="flood3()">Weiter →</button>${ok?'<div class="feedback good">Deine erste Idee passt: Tief und nahe am Fluss bedeutet normalerweise mehr Hochwasser-Risiko.</div>':'<div class="feedback">Tipp: Schau nochmals auf die Karte. Welche Gebäude stehen tief und nahe am Wasser?</div>'}</div>`)}function flood3(){for(let i=0;i<H.length;i++)S.floodGuess[i]=+document.getElementById('g'+i).value;shell(1,'Das Flut-Dorf','Ein Hochwasser bedeutet nicht automatisch: Das ganze Haus ist weg.',`${floodMap()}<div class="two"><div class="card"><h3>Schritt 3: Wie gross ist ein Schaden?</h3><div style="font-size:90px;text-align:center">🏡🌊</div><p>Wasser steht im Keller und im Erdgeschoss. Dach und obere Stockwerke sind noch da.</p><div class="choice" onclick="damagePick(1)">Das ganze Haus: 100 % des Werts</div><div class="choice" onclick="damagePick(.35)">Ein Teil: ungefähr 35 % des Werts</div><div class="choice" onclick="damagePick(.05)">Fast nichts: 5 % des Werts</div><div id="dfb"></div></div><div class="card"><h3>Beispiel Villa</h3><div class="stat">Wert der Villa<strong>2'500'000 CHF</strong></div><p>Wenn etwa 35 % beschädigt werden, kostet ein Hochwasser ungefähr:</p><div class="big">875'000 CHF</div><p class="muted">2'500'000 × 35 % = 875'000</p></div></div>`)}function damagePick(x){dfb.innerHTML=x===.35?`<div class="feedback good">Genau die Idee! Ein Gebäude kann teilweise beschädigt sein.</div><button class="btn" onclick="flood4()">Jetzt jedes Gebäude berechnen →</button>`:`<div class="feedback">Kann sein – aber in unserem Beispiel steht das Haus noch. Probiere die mittlere Antwort.</div>`}
function flood4(){shell(1,'Das Flut-Dorf','Jetzt rechnest du das Dorf selbst zusammen. Die Summe wächst mit jeder Zeile.',`${floodMap()}<div class="card"><h3>Schritt 4: Baue die Jahres-Summe</h3><p>Für jedes Gebäude: <b>Wert × Schadenanteil × deine geschätzte Häufigkeit</b>. Beispiel: 1-mal in 100 Jahren = 1 % pro Jahr.</p><div style="overflow:auto"><table class="calc-table"><thead><tr><th>Gebäude</th><th>Wert</th><th>Deine Häufigkeit</th><th>Bei Flut kaputt</th><th>Beitrag pro Jahr</th></tr></thead><tbody>${H.map((h,i)=>`<tr><td>${h[1]} ${h[0]}</td><td>${fmt(h[2])}</td><td><select id="fp${i}" onchange="fcalc()">${[1,3,5,10,15,25].map(v=>`<option value="${v}" ${S.floodGuess[i]==v?'selected':''}>${v} von 100 Jahren</option>`).join('')}</select></td><td><select id="fd${i}" onchange="fcalc()"><option value=".1">10 %</option><option value=".2">20 %</option><option value=".35" selected>35 %</option><option value=".5">50 %</option></select></td><td><b id="fr${i}">–</b></td></tr>`).join('')}</tbody></table></div><div class="stat">Summe: so viel Schaden erwarten wir im Durchschnitt pro Jahr<strong id="fsum">–</strong></div><p class="note">Wichtig: Diese Summe passiert nicht jedes Jahr. Sie ist ein Durchschnitt über sehr viele Jahre.</p><button class="btn" onclick="flood5()">Was muss die Versicherung zusätzlich einnehmen? →</button></div>`);fcalc()}
function fcalc(){let total=0;H.forEach((h,i)=>{let prob=+document.getElementById('fp'+i).value/100,dam=+document.getElementById('fd'+i).value,v=h[2]*prob*dam;total+=v;document.getElementById('fr'+i).textContent=fmt(v)});S.floodRisk=total;document.getElementById('fsum').textContent=fmt(total)}
function flood5(){let risk=S.floodRisk||H.reduce((s,h)=>s+h[2]*h[3]*h[4],0);let prem=risk*1.32;shell(1,'Das Flut-Dorf','Deine Rechnung ist der Start. Jetzt muss die Versicherung auch ihren Laden betreiben.',`${floodMap()}<div class="two"><div class="card"><h3>Schritt 5: Was muss die Versicherung einnehmen?</h3><div class="stat">Dein durchschnittlicher Schaden pro Jahr<strong>${fmt(risk)}</strong></div><p>Dazu kommen Mitarbeiter, Computer, Schadenbearbeitung, Steuern – und ein Puffer für schlechte Jahre.</p><div class="stat">Spiel-Prämie für das ganze Dorf<strong>${fmt(prem)}</strong></div><button class="btn warn" onclick="simFlood(${prem})">🎲 Ein Jahr spielen</button><div id="sim"></div></div><div class="card"><h3>Spiele viele Jahre!</h3><p>Manchmal passiert nichts. Manchmal trifft es mehrere Gebäude gleichzeitig.</p><div id="hist" class="timeline"></div></div></div>`)}let fy=0;function simFlood(prem){fy++;let loss=0,hit=[];H.forEach((h,i)=>{let prob=(S.floodGuess[i]||Math.round(h[3]*100))/100;if(Math.random()<prob){let dam=.35,l=h[2]*dam*(.6+Math.random()*.8);loss+=l;hit.push(h[1])}});let r=prem-loss;hist.innerHTML+=`<div class="year"><b>Jahr ${fy}</b><br>Schäden ${fmt(loss)}<br><b class="${r>=0?'moneypos':'moneyneg'}">${r>=0?'+':''}${fmt(r)}</b></div>`;sim.innerHTML=`<div class="feedback ${r<0?'bad':'good'}">${hit.length?'Hochwasser bei: '+hit.join(', '):'Glück gehabt: kein Hochwasser.'}<br>Dieses Jahr: <b>${r>=0?'Überschuss':'Verlust'} ${fmt(Math.abs(r))}</b></div>${fy>=5?unlock(1,'Risiko ist Zufall + Durchschnitt','Einzelne Jahre springen stark. Versicherungen brauchen viele Risiken, einen Puffer – und für sehr grosse Überraschungen oft Rückversicherung.'):''}`}
function q2(){shell(2,'Der Schokoladen-Fall','AlpenChoc verkauft Schokolade. Ein Fehler kann andere Menschen schädigen.',`<div class="two"><div class="card" style="text-align:center;font-size:100px">🏭🍫<p style="font-size:18px">AlpenChoc AG</p></div><div class="card"><h3>Was könnte teuer werden?</h3>${['Eine Maschine geht kaputt','Auf der Packung fehlt der Hinweis auf Nüsse','Der Chef lässt sein Handy fallen','Ein Lieferwagen verursacht einen Unfall','Jemand mag den Geschmack nicht'].map((x,i)=>`<div class="choice" data-i="${i}" onclick="this.classList.toggle('sel')">${x}</div>`).join('')}<button class="btn" onclick="choc2()">Weiter →</button></div></div>`)}function choc2(){shell(2,'Der Schokoladen-Fall','Auf einer Packung fehlt der Hinweis auf Nüsse. Menschen mit Allergie können krank werden.',`<div class="card"><h3>Was passiert nach dem ersten Tag?</h3><p>Heute wissen wir von <b>3 kranken Personen</b>. Ist der Schaden jetzt schon fertig bekannt?</p><div class="choice" onclick="chocThink(0)">Ja. Wir kennen 3 Fälle – fertig.</div><div class="choice" onclick="chocThink(1)">Vielleicht nicht. Weitere Leute könnten sich später melden.</div><div class="choice" onclick="chocThink(2)">Der Schaden wird automatisch jeden Monat kleiner.</div><div id="cfb"></div></div>`)}function chocThink(x){cfb.innerHTML=x===1?`<div class="feedback good">Genau. Manche Leute essen die Schokolade erst später. Andere gehen erst später zum Arzt. Und vielleicht braucht es Anwälte.</div><button class="btn" onclick="choc3()">Was könnte noch passieren? →</button>`:`<div class="feedback">Überlege: Sind wirklich schon alle Tafeln gegessen? Wissen schon alle Betroffenen, was passiert ist?</div>`}function choc3(){shell(2,'Der Schokoladen-Fall','Baue selbst eine mögliche Geschichte des Schadens.',`<div class="card"><h3>Welche Dinge können den Schaden später noch verändern?</h3>${['Weitere kranke Personen melden sich','Ärzte entdecken schwere Folgen','Anwälte und Gerichte kosten Geld','Alle verkauften Tafeln verschwinden von selbst','Einige Fälle werden schneller gelöst als gedacht'].map(x=>`<div class="choice" onclick="this.classList.toggle('sel')">${x}</div>`).join('')}<button class="btn" onclick="choc4()">Zeige, wie sich unser Beispiel entwickelt →</button></div>`)}function choc4(){shell(2,'Der Schokoladen-Fall','Der Schaden wächst – aber wer weiss wann davon?',`<div class="card"><h3>AlpenChoc und seine Versicherung sehen zuerst nur einen Teil</h3><div class="timeline"><div class="year"><b>Woche 1</b><br>3 Fälle<br>0.2 Mio. CHF</div><div class="year"><b>Monat 6</b><br>18 Fälle<br>1.5 Mio. CHF</div><div class="year"><b>Jahr 2</b><br>Gerichtsfälle<br>4 Mio. CHF</div><div class="year"><b>Jahr 4</b><br>fast geklärt<br>6 Mio. CHF</div></div><div class="feedback"><b>Aber der Rückversicherer?</b><br>Vielleicht weiss er bis Jahr 2 noch fast nichts davon. Die Versicherung meldet ihm grosse oder möglicherweise grosse Schäden oft erst später. Dann kommt plötzlich die Nachricht: „Dieser Fall könnte teuer werden.“</div><button class="btn" onclick="choc5()">Was bedeutet das für den Rückversicherer? →</button></div>`)}function choc5(){shell(2,'Der Schokoladen-Fall','Manchmal erfährt der Rückversicherer erst spät, dass ein alter Schaden gross werden könnte.',`<div class="card"><div class="timeline"><div class="year"><b>Jahr 0</b><br>🍫 Unfall passiert<br><span class="muted">Rückversicherer: weiss nichts</span></div><div class="year"><b>Jahr 1</b><br>Fälle wachsen<br><span class="muted">weiss vielleicht noch wenig</span></div><div class="year"><b>Jahr 2</b><br>📨 Meldung<br><b>„Könnte 4 Mio. kosten“</b></div><div class="year"><b>Jahr 4</b><br>⚖️ fast geklärt<br><b>6 Mio. CHF</b></div></div><p>Darum muss ein Rückversicherer auch Geld für Schäden zurückhalten, die <b>schon passiert sind, aber noch nicht vollständig bekannt</b> sind.</p>${unlock(2,'Manche Schäden brauchen Zeit','Bei Haftpflicht kann ein Schaden Jahre wachsen. Und der Rückversicherer kann erst später davon erfahren.')}</div>`)}
function moneyWords(m){m=+m;if(m>=1000000)return (m/1000000).toLocaleString('de-CH')+' Billionen CHF';if(m>=1000)return (m/1000).toLocaleString('de-CH')+' Milliarden CHF';return m.toLocaleString('de-CH')+' Millionen CHF'}function q3(){shell(3,'Das grosse Erdbeben','Erst die Grössen verstehen, dann schätzen.',`<div class="two"><div class="card mapbox"><div class="world">🌍</div><b>Welt</b><div class="arrow">↓</div><div class="japan">🗾</div><b>Japan</b><div class="arrow">↓</div><div class="tokyo">🏙️</div><b>Raum Tokio</b><p>Japan hat ungefähr <b>15-mal</b> so viele Einwohner wie die Schweiz. Im Grossraum Tokio leben sogar mehrere Male so viele Menschen wie in der ganzen Schweiz.</p></div><div class="card"><h3>Schritt 1: Was steht dort alles?</h3><p>Wähle mehrere Dinge aus.</p>${['Häuser und Wohnungen','Büros und Hochhäuser','Fabriken','Züge und Bahnhöfe','Strassen und Brücken','Autos und Waren'].map(x=>`<div class="choice" onclick="this.classList.toggle('sel')">${x}</div>`).join('')}<button class="btn" onclick="japan2()">Weiter zum Schätzen →</button></div></div>`)}function japan2(){shell(3,'Das grosse Erdbeben','Du schätzt jetzt mit Prozenten – nicht mit endlosen Nullen.',`<div class="card"><div class="stat">Alles zusammen, was im Spiel gefährdet ist<strong>5'000 Milliarden CHF</strong></div><label class="label">Wie viel Prozent davon werden beim grossen Beben beschädigt?</label><select id="jdp"><option value="1">1 %</option><option value="2">2 %</option><option value="4" selected>4 %</option><option value="8">8 %</option><option value="15">15 %</option></select><label class="label">Wie viel Prozent dieses Schadens sind versichert?</label><select id="jip"><option value="10">10 %</option><option value="20">20 %</option><option value="35" selected>35 %</option><option value="60">60 %</option><option value="80">80 %</option></select><button class="btn red" onclick="japan3()">🌎 Erdbeben auslösen →</button></div>`)}function japan3(){let total=5000000,dp=+jdp.value/100,ip=+jip.value/100,damage=total*dp,insured=damage*ip,uninsured=damage-insured,people=100000,per=uninsured*1000000/people;shell(3,'Das grosse Erdbeben','Jetzt siehst du, was deine Prozent-Schätzung in Geld bedeutet.',`<div class="card"><table><tr><th>Was?</th><th>Deine Schätzung</th></tr><tr><td>Alles, was gefährdet ist</td><td><b>5'000 Milliarden CHF</b></td></tr><tr><td>Beschädigt (${(dp*100).toFixed(0)} %)</td><td><b>${moneyWords(damage)}</b></td></tr><tr><td>Davon versichert (${(ip*100).toFixed(0)} %)</td><td><b>${moneyWords(insured)}</b></td></tr><tr><td>Nicht versichert</td><td><b>${moneyWords(uninsured)}</b></td></tr></table><h3>Was bedeutet „nicht versichert“ für Menschen?</h3><p>Nehmen wir für unser einfaches Beispiel an, <b>${people.toLocaleString('de-CH')} Menschen</b> müssten diesen nicht versicherten Teil tragen.</p><div class="stat">Nicht versicherter Schaden pro betroffener Person<strong>${Math.round(per).toLocaleString('de-CH')} CHF</strong></div><p>Rechnung: ${moneyWords(uninsured)} ÷ ${people.toLocaleString('de-CH')} Menschen. Natürlich ist der echte Schaden nicht gleichmässig verteilt. Aber die Rechnung zeigt, wie riesig die Belastung sein kann.</p><div class="feedback"><b>Versichert:</b> Versicherung und Rückversicherung können beim Wiederaufbau helfen.<br><b>Nicht versichert:</b> Menschen, Firmen oder der Staat müssen das Geld anderswo finden.</div>${unlock(3,'Versicherung hilft beim Wiederaufbau','Ein Erdbeben kann niemand verhindern. Versicherung und Rückversicherung können aber verhindern, dass Menschen und Firmen den ganzen finanziellen Schaden allein tragen müssen.')}</div>`)}
function q4(){S.bank=20;S.bad=0;S.year=0;S.re=false;shell(4,'Bleibt deine Versicherung offen?','Du startest mit 20 Mio. CHF. Spiele Jahr für Jahr.',`<div class="card"><div class="stat">Geld zum Start<strong id="bank">20 Mio. CHF</strong></div><div class="capitalbar"><div id="bankbar" style="width:40%">20</div></div><p>Der Balken zeigt, wie viel Geld deiner Versicherung noch bleibt. Jedes Jahr kommen <b>12 Mio. CHF Prämien</b> herein. Mitarbeiter, Büros und Computer kosten <b>3 Mio. CHF</b>. Dann kommen die Schäden.</p><button class="btn warn" onclick="bankYear()">🎲 Nächstes Jahr spielen</button></div><br><div class="card"><h3>Jahr für Jahr</h3><div id="years"></div><div id="reg"></div><p class="muted">Ein schlechtes Jahr schliesst dich nicht sofort. Aber wenn du mehrere Jahre zu wenig Geld hast, greift die Aufsicht ein.</p></div>`)}function bankYear(){S.year++;let startBank=S.bank,roll=Math.random(),claims=roll<.12?25+Math.random()*25:roll<.35?10+Math.random()*8:4+Math.random()*5;let grossClaims=claims,rePay=0,reCost=S.re?1.5:0;if(S.re&&claims>12){rePay=claims-12;claims=12}S.bank+=12-3-reCost-claims;if(S.bank<0)S.bad++;else S.bad=0;years.innerHTML+=`<div class="card" style="margin:10px 0"><b>Jahr ${S.year}</b><div class="stat">Start<strong>${startBank.toFixed(1)} Mio.</strong></div><p>+ 12.0 Mio. Prämien<br>− 3.0 Mio. Gehälter & Betrieb${S.re?'<br>− 1.5 Mio. für Rückversicherung':''}<br>− ${claims.toFixed(1)} Mio. Schäden${rePay?`<br><span class="moneypos">Rückversicherer übernimmt zusätzlich ${rePay.toFixed(1)} Mio. vom Grossschaden (${grossClaims.toFixed(1)} Mio.)</span>`:''}</p><div class="stat">Am Jahresende übrig<strong class="${S.bank>=0?'moneypos':'moneyneg'}">${S.bank.toFixed(1)} Mio. CHF</strong></div></div>`;bank.textContent=S.bank.toFixed(1)+' Mio. CHF';let pct=Math.max(2,Math.min(100,(Math.max(0,S.bank)/50)*100));bankbar.style.width=pct+'%';bankbar.textContent=S.bank>0?S.bank.toFixed(1):'0';if(S.bank<0)bankbar.style.background='var(--red)';if(S.bad===1)reg.innerHTML='<div class="feedback bad"><b>⚠️ Aufsicht:</b> Dein Geld ist unter null. Du darfst noch weitermachen, aber das darf nicht zum Dauerzustand werden.</div>';if(S.bad===2&&!S.re)reg.innerHTML='<div class="feedback bad"><b>⚠️ Zweites Jahr in Folge unter null.</b> Noch ein negatives Jahr und die Aufsicht schliesst deine Firma.</div><button class="btn" onclick="addRe()">Kann ich grosse Schäden mit jemandem teilen?</button>';if(S.bad>=3){reg.innerHTML='<div class="feedback bad"><b>🛑 Die Aufsicht schliesst deine Versicherung.</b> Sie muss sicher sein, dass Kunden auch morgen noch bezahlt werden können.</div><button class="btn" onclick="q4()">Neu starten</button> <button class="btn warn" onclick="q4ReStart()">Neu starten – mit Rückversicherung</button>'}if(S.year>=6&&S.bad<3)reg.innerHTML=unlock(4,'Eine Versicherung braucht Reserven','Prämien müssen Schäden und laufende Kosten bezahlen. Einzelne schlechte Jahre sind möglich; mehrere schlechte Jahre können gefährlich werden.')+`<button class="btn warn" onclick="addRe()">Jetzt Rückversicherung ausprobieren →</button>`}function addRe(){S.re=true;reg.innerHTML='<div class="feedback good"><b>Rückversicherung eingeschaltet.</b> Du zahlst jedes Jahr 1.5 Mio. CHF. Dafür übernimmt der Rückversicherer in unserem Spiel den Teil eines Schadens, der über 12 Mio. CHF liegt.</div>'}function q4ReStart(){q4();setTimeout(addRe,0)}
function q5(){shell(5,'Risiko-Detektiv','Ein Computer sagt: „Kaum Flutschäden in 20 Jahren – also wenig Risiko.“ Reicht das?',`<div class="two"><div class="card" style="text-align:center;font-size:100px">🏭🧮<p style="font-size:18px">Computer: „Sieht sicher aus!“</p></div><div class="card"><h3>Welche Hinweise willst du prüfen?</h3>${['Alte Schäden','Neue Flutkarte','Wie die Fabrik gebaut ist','Ob neue Gebäude dazugekommen sind','Ein zufälliger Social-Media-Kommentar','Bericht eines Ingenieurs'].map(x=>`<div class="choice" onclick="this.classList.toggle('sel')">${x}</div>`).join('')}<button class="btn" onclick="riskReveal()">Hinweis aufdecken →</button><div id="rfb"></div></div></div>`)}function riskReveal(){rfb.innerHTML=`<div class="feedback"><b>Überraschung:</b> Letztes Jahr wurde ein neues, sehr teures Gebäude direkt neben dem Fluss gebaut. In den alten 20 Jahren war es noch gar nicht da.</div>${unlock(5,'Gute Entscheidungen brauchen mehrere Hinweise','Vergangenheit hilft. Aber Risiken verändern sich. Gute Underwriter kombinieren Daten, Modelle, Fachwissen und gesundes Nachfragen.')}`}
function q6(){shell(6,'Der grosse Rückversicherungs-Deal','Eine Versicherung möchte, dass du ihre sehr grossen Katastrophenschäden mitträgst.',`<div class="two"><div class="card"><h3>Der Deal</h3><p>In vielen Jahren zahlst du <b>gar nichts</b>. Aber wenn eine riesige Katastrophe kommt, kann es sehr teuer werden.</p><div class="stat">Geschätzter Durchschnittsschaden pro Jahr<strong>3 Mio. CHF</strong></div><h3>Welchen Preis verlangst du pro Jahr?</h3>${[2,4,7,12].map(x=>`<div class="choice" onclick="deal(${x})">${x} Mio. CHF</div>`).join('')}</div><div class="card"><h3>Die Versicherung antwortet</h3><div id="dealfb" class="feedback">Wähle einen Preis.</div></div></div>`)}function deal(p){let t=p===12?'Zu teuer! Wir fragen jemand anderen.':p===7?'Teuer, aber vielleicht.':p===4?'Klingt fair. Deal!':'So billig? Sofort Deal!';dealfb.innerHTML=`<b>„${t}“</b>${p<12?`<br><br><button class="btn warn" onclick="ten(${p})">10 Jahre spielen →</button>`:''}`}function ten(p){let arr=[],sum=0;for(let y=1;y<=10;y++){let l=Math.random()<.14?15+Math.random()*55:Math.random()<.12?Math.random()*7:0;sum+=p-l;arr.push([l,p-l])}shell(6,'Der grosse Rückversicherungs-Deal','Zehn Jahre sind vorbei. Ein anderes Jahrzehnt kann völlig anders aussehen.',`<div class="card"><div class="timeline">${arr.map((a,i)=>`<div class="year"><b>Jahr ${i+1}</b><br>Schaden ${a[0].toFixed(1)} Mio.<br><b class="${a[1]>=0?'moneypos':'moneyneg'}">${a[1]>=0?'+':''}${a[1].toFixed(1)} Mio.</b></div>`).join('')}</div><div class="stat">Ergebnis nach 10 Jahren<strong class="${sum>=0?'moneypos':'moneyneg'}">${sum.toFixed(1)} Mio. CHF</strong></div><button class="btn warn" onclick="ten(${p})">🎲 Noch einmal 10 Jahre</button> <button class="btn alt" onclick="q6()">Anderen Preis wählen</button>${unlock(6,'Seltene Risiken sind unberechenbar','Ein Rückversicherer kann jahrelang Geld verdienen und dann in einem einzigen Jahr sehr viel verlieren. Darum sind Preis, Reserven und viele verschiedene Risiken wichtig.')}</div>`)}
function fmt(n){return Math.round(n).toLocaleString('de-CH')+' CHF'}function num(n){return (+n).toLocaleString('de-CH')}home();
</script></body></html>
